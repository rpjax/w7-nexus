<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fundo Dark Premium Sutil -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#11141a" />
      <stop offset="100%" stop-color="#07090d" />
    </linearGradient>

    <!-- Gradiente dos Óculos Cyberpunk do Macaco -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#bc8cff" />
    </linearGradient>

    <!-- Gradiente do Topo do Navegador (Barra de Título) -->
    <linearGradient id="browserHeaderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d333b" />
      <stop offset="100%" stop-color="#21262d" />
    </linearGradient>

    <!-- Gradiente para Elementos de Wireframe/Carregamento -->
    <linearGradient id="wireframeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#30363d" />
    </linearGradient>
  </defs>
  
  <!-- Painel Base Quadrado com Cantos Arredondados -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)" stroke="#1f242c" stroke-width="4"/>

  <!-- CONTEÚDO DO FUNDO: Elementos Discretos de Infraestrutura -->
  <g fill="none" opacity="0.06" stroke-linecap="round">
    <line x1="100" y1="40" x2="100" y2="200" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="2,8"/>
    <line x1="412" y1="40" x2="412" y2="200" stroke="#bc8cff" stroke-width="1.5" stroke-dasharray="4,12"/>
    <rect x="50" y="60" width="90" height="30" rx="4" stroke="#58a6ff" stroke-width="1.5" />
    <rect x="280" y="50" width="160" height="45" rx="6" stroke="#bc8cff" stroke-width="1.5" />
    <path d="M 140,75 L 280,65" stroke="#30363d" stroke-width="2"/>
  </g>

  <!-- BLOCO UNIFICADO (MACACO + NAVEGADOR WEB) CENTRALIZADO EM 'CENTER CENTER' -->
  <g transform="translate(0, -60)">
    
    <!-- 1. O MACACO (Camada de Trás - Ajustado para Y=30 para revelar totalmente os óculos) -->
    <g transform="translate(0, 30)">
      <!-- Orelhas grandes laterais -->
      <circle cx="135" cy="235" r="46" fill="#1f242d" stroke="#2d333b" stroke-width="4" />
      <circle cx="135" cy="235" r="26" fill="#11141a" />
      
      <circle cx="377" cy="235" r="46" fill="#1f242d" stroke="#2d333b" stroke-width="4" />
      <circle cx="377" cy="235" r="26" fill="#11141a" />

      <!-- Estrutura Principal da Cabeça -->
      <path d="M 155 255 C 155 150, 357 150, 357 255 C 357 340, 155 340, 155 255 Z" fill="#1f242d" stroke="#2d333b" stroke-width="5"/>
      
      <!-- Focinho -->
      <path d="M 195 285 C 195 255, 317 255, 317 285 C 317 330, 195 330, 195 285 Z" fill="#282e36" />

      <!-- Óculos de Sol Neon Cyberpunk -->
      <path d="M 162 212 L 243 218 L 238 263 L 172 257 Z" fill="#0d1117" stroke="url(#accentGrad)" stroke-width="6" stroke-linejoin="round"/>
      <path d="M 269 218 L 350 212 L 340 257 L 274 263 Z" fill="#090b0e" stroke="url(#accentGrad)" stroke-width="6" stroke-linejoin="round"/>
      
      <!-- Linhas de dump de tráfego injetadas na lente direita -->
      <path d="M 288 222 L 336 222" stroke="#bc8cff" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
      <path d="M 283 234 L 320 234" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
      <path d="M 285 246 L 303 246" stroke="#3fb950" stroke-width="3" stroke-linecap="round" opacity="0.9"/>

      <!-- Antena Wireless de Escuta -->
      <path d="M 395 200 L 420 165" stroke="#58a6ff" stroke-width="5" stroke-linecap="round" />
      <circle cx="420" cy="165" r="7" fill="#bc8cff" />
    </g>

    <!-- 2. A JANELA DO NAVEGADOR (Camada da Frente - Exibindo o Wireframe de um Site) -->
    <g transform="translate(66, 305)">
      <!-- Corpo Principal da Janela -->
      <rect width="380" height="192" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="4" />
      
      <!-- Barra de Abas / Título -->
      <rect width="380" height="32" rx="12" fill="url(#browserHeaderGrad)" />
      <rect y="20" width="380" height="12" fill="#21262d" />
      <line x1="0" y1="32" x2="380" y2="32" stroke="#30363d" stroke-width="1.5" />

      <!-- Botões de Controle (Janela do Browser) -->
      <circle cx="20" cy="16" r="5" fill="#f85149" opacity="0.8" />
      <circle cx="36" cy="16" r="5" fill="#d29922" opacity="0.8" />
      <circle cx="52" cy="16" r="5" fill="#3fb950" opacity="0.8" />
      
      <!-- Pequena URL Simbólica discreta na barra -->
      <rect x="80" y="7" width="160" height="18" rx="4" fill="#0d1117" opacity="0.6" />
      <text x="90" y="20" font-family="ui-monospace, monospace" font-size="10" fill="#6e7681">localhost:3000</text>

      <!-- CONTEÚDO DO SITE (Wireframe / Layout em Carregamento) -->
      <g transform="translate(20, 48)">
        <!-- Header Fake do Site -->
        <rect width="70" height="14" rx="3" fill="url(#wireframeGrad)" />
        <circle cx="310" cy="7" r="6" fill="#30363d" />
        <circle cx="330" cy="7" r="6" fill="#30363d" />

        <!-- Esqueleto de Banner Principal (Hero/Dashboard placeholder) -->
        <rect y="24" width="340" height="50" rx="6" fill="url(#wireframeGrad)" opacity="0.7" />
        <!-- Linhas de carregamento simulando textos do esqueleto do site -->
        <rect x="15" y="36" width="140" height="10" rx="2" fill="#58a6ff" opacity="0.25" />
        <rect x="15" y="52" width="220" height="7" rx="2" fill="#30363d" />

        <!-- Grid de Conteúdo Inferior (Cards/Seções do Site) -->
        <!-- Card Esquerdo (Ex: Placeholder de Imagem/Gráfico) -->
        <rect y="84" width="160" height="46" rx="6" fill="url(#wireframeGrad)" opacity="0.5" />
        <path d="M 10,120 L 40,95 L 70,110 L 110,90 L 150,120" fill="none" stroke="#bc8cff" stroke-width="2" stroke-linejoin="round" opacity="0.4" />
        
        <!-- Card Direito (Ex: Placeholders de Linhas de Texto) -->
        <rect x="180" y="84" width="160" height="46" rx="6" fill="url(#wireframeGrad)" opacity="0.5" />
        <rect x="192" y="94" width="136" height="6" rx="1.5" fill="#30363d" />
        <rect x="192" y="106" width="110" height="6" rx="1.5" fill="#30363d" />
        <rect x="192" y="118" width="60" height="6" rx="1.5" fill="#3fb950" opacity="0.3" />
      </g>
    </g>

  </g>
</svg>
